<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Мандарин</span></h1>
<p style="text-align: center;"><span style="color: #333333;"><strong>Мандари́н</strong>&nbsp;(<a style="color: #333333;" title="Латинский язык" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Cītrus reticulāta</span>)&nbsp;&mdash; небольшое&nbsp;<a class="mw-redirect" style="color: #333333;" title="Вечнозелёное растение" href="https://ru.wikipedia.org/wiki/%D0%92%D0%B5%D1%87%D0%BD%D0%BE%D0%B7%D0%B5%D0%BB%D1%91%D0%BD%D0%BE%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D0%B5">вечнозелёное</a>&nbsp;<a style="color: #333333;" title="Дерево" href="https://ru.wikipedia.org/wiki/%D0%94%D0%B5%D1%80%D0%B5%D0%B2%D0%BE">дерево</a>,&nbsp;<a style="color: #333333;" title="Биологический вид" href="https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%B8%D0%B4">вид</a>&nbsp;рода&nbsp;<a style="color: #333333;" title="Цитрус" href="https://ru.wikipedia.org/wiki/%D0%A6%D0%B8%D1%82%D1%80%D1%83%D1%81">Цитрус</a>&nbsp;(<em><span lang="la">Citrus</span></em>) семейства&nbsp;<a style="color: #333333;" title="Рутовые" href="https://ru.wikipedia.org/wiki/%D0%A0%D1%83%D1%82%D0%BE%D0%B2%D1%8B%D0%B5">Рутовые</a>&nbsp;(<em><span lang="la">Rutaceae</span></em>); это же слово обозначает&nbsp;<a style="color: #333333;" title="Мандарин (фрукт)" href="https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D0%BD%D0%B4%D0%B0%D1%80%D0%B8%D0%BD_(%D1%84%D1%80%D1%83%D0%BA%D1%82)">плод этого растения</a>.</span></p>
