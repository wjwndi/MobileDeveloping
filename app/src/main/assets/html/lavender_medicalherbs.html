<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Лаванда</span></h1>
<p style="text-align: center;"><span style="color: #333333;"><strong>Лава́нда</strong>&nbsp;(<a style="color: #333333;" title="Латинский язык" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Lavandula</span>)&nbsp;&mdash;&nbsp;<a style="color: #333333;" title="Род (биология)" href="https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D0%B4_(%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F)">род</a>&nbsp;растений семейства&nbsp;<a style="color: #333333;" title="Яснотковые" href="https://ru.wikipedia.org/wiki/%D0%AF%D1%81%D0%BD%D0%BE%D1%82%D0%BA%D0%BE%D0%B2%D1%8B%D0%B5">яснотковых</a>&nbsp;(<em>Lamiaceae</em>&nbsp;или&nbsp;<em>Labiatae</em>). Включает 47<sup id="cite_ref-TPL_1-0" class="reference"><a style="color: #333333;" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D0%B2%D0%B0%D0%BD%D0%B4%D0%B0#cite_note-TPL-1"><span class="cite-bracket">[</span>1<span class="cite-bracket">]</span></a></sup>&nbsp;видов. Произрастает на&nbsp;<a style="color: #333333;" title="" href="https://ru.wikipedia.org/wiki/%D0%9A%D0%B0%D0%BD%D0%B0%D1%80%D1%81%D0%BA%D0%B8%D0%B5_%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%B2%D0%B0">Канарских островах</a>, в северной и восточной&nbsp;<a style="color: #333333;" title="Африка" href="https://ru.wikipedia.org/wiki/%D0%90%D1%84%D1%80%D0%B8%D0%BA%D0%B0">Африке</a>, в&nbsp;<a style="color: #333333;" title="Австралия (континент)" href="https://ru.wikipedia.org/wiki/%D0%90%D0%B2%D1%81%D1%82%D1%80%D0%B0%D0%BB%D0%B8%D1%8F_(%D0%BA%D0%BE%D0%BD%D1%82%D0%B8%D0%BD%D0%B5%D0%BD%D1%82)">Австралии</a>, на юге&nbsp;<a style="color: #333333;" title="Европа" href="https://ru.wikipedia.org/wiki/%D0%95%D0%B2%D1%80%D0%BE%D0%BF%D0%B0">Европы</a>, в&nbsp;<a class="mw-redirect" style="color: #333333;" title="Аравия" href="https://ru.wikipedia.org/wiki/%D0%90%D1%80%D0%B0%D0%B2%D0%B8%D1%8F">Аравии</a>&nbsp;и в&nbsp;<a style="color: #333333;" title="Индия" href="https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D0%B4%D0%B8%D1%8F">Индии</a>. Культурные формы выращиваются в садах во всём мире.</span></p>
