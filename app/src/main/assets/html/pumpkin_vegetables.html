<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Тыква</span></h1>
<p style="text-align: center;"><span style="color: #333333;"><strong>Ты́ква</strong>&nbsp;(<a style="color: #333333;" title="Латинский язык" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Cucurbita</span>)&nbsp;&mdash;&nbsp;<a style="color: #333333;" title="Род (биология)" href="https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D0%B4_(%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F)">род</a>&nbsp;травянистых растений семейства&nbsp;<a style="color: #333333;" title="Тыквенные" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%8B%D0%BA%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B5">Тыквенные</a>&nbsp;(<em><span lang="la">Cucurbitaceae</span></em>).</span></p>
<p style="text-align: center;"><span style="color: #333333;">Под словом &laquo;тыква&raquo; в&nbsp;<a style="color: #333333;" title="Россия" href="https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D1%8F">России</a>&nbsp;обычно понимаются&nbsp;<a style="color: #333333;" title="Биологический вид" href="https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%B8%D0%B4">виды</a>&nbsp;<a style="color: #333333;" title="" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%8B%D0%BA%D0%B2%D0%B0_%D0%BE%D0%B1%D1%8B%D0%BA%D0%BD%D0%BE%D0%B2%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F">Тыква обыкновенная</a>&nbsp;(<em><span lang="la">Cucurbita pepo</span></em>) и&nbsp;<a style="color: #333333;" title="Тыква гигантская" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%8B%D0%BA%D0%B2%D0%B0_%D0%B3%D0%B8%D0%B3%D0%B0%D0%BD%D1%82%D1%81%D0%BA%D0%B0%D1%8F">Тыква гигантская</a>&nbsp;(<em>Cucurbita maxima</em>), широко распространённые и культивируемые как пищевое и кормовое растение.</span></p>
