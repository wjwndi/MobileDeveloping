<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Цикорий</span></h1>
<p style="text-align: center;"><span style="color: #333333;"><strong>Цико́рий</strong>&nbsp;(<a style="color: #333333;" title="Латинский язык" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Cich&oacute;rium</span>)&nbsp;&mdash;&nbsp;<a style="color: #333333;" title="Род (биология)" href="https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D0%B4_(%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F)">род</a>&nbsp;<a style="color: #333333;" title="" href="https://ru.wikipedia.org/wiki/%D0%94%D0%B2%D1%83%D0%BB%D0%B5%D1%82%D0%BD%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">двулетних</a>&nbsp;или&nbsp;<a style="color: #333333;" title="Многолетние растения" href="https://ru.wikipedia.org/wiki/%D0%9C%D0%BD%D0%BE%D0%B3%D0%BE%D0%BB%D0%B5%D1%82%D0%BD%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">многолетних</a>&nbsp;<a style="color: #333333;" title="Травянистые растения" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%80%D0%B0%D0%B2%D1%8F%D0%BD%D0%B8%D1%81%D1%82%D1%8B%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">трав</a>&nbsp;<a style="color: #333333;" title="Семейство" href="https://ru.wikipedia.org/wiki/%D0%A1%D0%B5%D0%BC%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%BE">семейства</a>&nbsp;<a style="color: #333333;" title="Астровые" href="https://ru.wikipedia.org/wiki/%D0%90%D1%81%D1%82%D1%80%D0%BE%D0%B2%D1%8B%D0%B5">Астровые, или Сложноцветные</a>. Род включает в себя два&nbsp;<a style="color: #333333;" title="Культурные растения" href="https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D0%BB%D1%8C%D1%82%D1%83%D1%80%D0%BD%D1%8B%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">культивируемых</a>&nbsp;<a style="color: #333333;" title="Биологический вид" href="https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%B8%D0%B4">вида</a>&nbsp;и не менее восьми дикорастущих.</span></p>
