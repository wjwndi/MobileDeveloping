<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Траметес разноцветный</span></h1>
<p style="text-align: center;"><strong>Трутовик разноцветный</strong>, или&nbsp;<strong>траметес разноцветный</strong>&nbsp;(<a title="Латинский язык" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Trametes versicolor</span>) &mdash; широко распространённый гриб-<a title="Трутовики" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%80%D1%83%D1%82%D0%BE%D0%B2%D0%B8%D0%BA%D0%B8">трутовик</a>, сапрофит. По-английски гриб называется дословно &laquo;индюшачьим хвостом&raquo; (<a title="Английский язык" href="https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D0%B3%D0%BB%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">англ</a>.&nbsp;<em>turkey tail).</em></p>
