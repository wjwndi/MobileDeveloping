<h1 id="firstHeading" class="firstHeading mw-first-heading" style="text-align: center;"><span class="mw-page-title-main">Огурец</span></h1>
<p style="text-align: center;"><span style="color: #333333;"><strong>Огуре́ц обыкнове́нный</strong>, или&nbsp;<strong>Огурец посевно́й</strong>&nbsp;(<a style="color: #333333;" title="" href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B0%D1%82%D0%B8%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8F%D0%B7%D1%8B%D0%BA">лат.</a>&nbsp;<span lang="la">Cucumis sativus</span>),&nbsp;&mdash;&nbsp;<a style="color: #333333;" title="Однолетние растения" href="https://ru.wikipedia.org/wiki/%D0%9E%D0%B4%D0%BD%D0%BE%D0%BB%D0%B5%D1%82%D0%BD%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">однолетнее</a>&nbsp;<a style="color: #333333;" title="Травянистые растения" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%80%D0%B0%D0%B2%D1%8F%D0%BD%D0%B8%D1%81%D1%82%D1%8B%D0%B5_%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D1%8F">травянистое растение</a>,&nbsp;<a style="color: #333333;" title="Биологический вид" href="https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%B8%D0%B4">вид</a>&nbsp;рода&nbsp;<a style="color: #333333;" title="Огурец (род)" href="https://ru.wikipedia.org/wiki/%D0%9E%D0%B3%D1%83%D1%80%D0%B5%D1%86_(%D1%80%D0%BE%D0%B4)">Огурец</a>&nbsp;(<em><span lang="la">Cucumis</span></em>) семейства&nbsp;<a style="color: #333333;" title="Тыквенные" href="https://ru.wikipedia.org/wiki/%D0%A2%D1%8B%D0%BA%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B5">Тыквенные</a>&nbsp;(<em><span lang="la">Cucurbitaceae</span></em>),&nbsp;<a class="mw-redirect" style="color: #333333;" title="Овощная культура" href="https://ru.wikipedia.org/wiki/%D0%9E%D0%B2%D0%BE%D1%89%D0%BD%D0%B0%D1%8F_%D0%BA%D1%83%D0%BB%D1%8C%D1%82%D1%83%D1%80%D0%B0">овощная культура</a>.</span></p>
